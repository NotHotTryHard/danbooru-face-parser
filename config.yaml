dataset:
  repo_id: deepghs/danbooru2024-webp-4Mpixel

paths:
  cache: ./data
  output: ./output

filter:
  include_tags: [ahegao]
  exclude_tags: []
  limit: 0 # 0 = no limit

download:
  max_workers: 8
  keep_originals: true

face_detection:
  level: s # n = faster, s = more accurate
  confidence_threshold: 0.8
  bbox_scale: 1.2 # expand the detected face box before cropping

output:
  image:
    width: 256
    height: 256
    pad: none # none | edge | white | black | transparent
    format: webp # webp | jpg | png
    quality: 95
  save_metadata: true
